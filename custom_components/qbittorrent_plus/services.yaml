get_torrents:
  name: Get torrents
  description: Return formatted torrent info for a status filter.
  fields:
    config_entry_id:
      name: Config entry ID
      description: Target qBittorrent Plus config entry.
      required: false
      selector:
        text:
    filter:
      name: Filter
      description: qBittorrent status filter.
      required: false
      default: all
      selector:
        select:
          options:
            - all
            - downloading
            - seeding
            - completed
            - paused
            - active
            - inactive
            - resumed
            - stalled
            - stalled_uploading
            - stalled_downloading
            - errored

get_torrent:
  name: Get torrent
  description: Return details for a single torrent hash.
  fields:
    config_entry_id:
      name: Config entry ID
      required: false
      selector:
        text:
    hash:
      name: Torrent hash
      required: true
      selector:
        text:

