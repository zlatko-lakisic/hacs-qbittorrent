      name: Hashes
      required: false
      selector:
        text:
    hash:
      name: Hash
      required: false
      selector:
        text:
    ratio_limit:
      name: Ratio limit
      required: false
      default: -1
      selector:
        number:
          min: -1
          max: 100
          step: 0.1
    seeding_time_limit:
      name: Seeding time limit (minutes)
      required: false
      default: -1
      selector:
        number:
          min: -1
          max: 100000
          step: 1

set_speed_limits:
  name: Set speed limits
  description: Set global or per-torrent download/upload limits in bytes/s (0 = unlimited).
  fields:
    config_entry_id:
      name: Config entry ID
      required: false
      selector:
        text:
    hashes:
      name: Hashes
      required: false
      selector:
        text:
    hash:
      name: Hash
      required: false
      selector:
        text:
    download_limit:
      name: Download limit
      required: false
      selector:
        number:
          min: 0
          max: 104857600
          step: 1024
          unit_of_measurement: B/s
    upload_limit:
      name: Upload limit
      required: false
      selector:
        number:
          min: 0
          max: 104857600
          step: 1024
          unit_of_measurement: B/s

